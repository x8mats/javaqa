plugins {
    id 'java'
    id 'io.qameta.allure' version "4.3.1"
}

def allureVersion = "2.35.6"
def allureCliVersion = "2.46.1"

allure {
    report {
        version.set(allureCliVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks{
            junit5{
                adapterVersion.set(allureVersion)
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.codeborne:selenide:7.13.0'
    testImplementation 'net.datafaker:datafaker:2.7.0'
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation "io.qameta.allure:allure-selenide"
}

test {
    useJUnitPlatform()
}